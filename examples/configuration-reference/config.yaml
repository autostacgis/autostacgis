solver:
  backward_chain:
    max_steps: 16
    max_states: 10000
    max_bindings: 10000
    timeout: 30
goal:
  metadata-value:
  - name: reference
    kind: raster
    select:
      require:
        properties.platform: example-sensor
    count: 1
    coverage:
      geometry:
        type: Polygon
        coordinates:
        - - - -156
            - 19
          - - -155
            - 19
          - - -155
            - 20
          - - -156
            - 20
          - - -156
            - 19
      mode: footprint
    path: assets.$asset.data_state:statistics_calculated
    value: true
  - name: aligned
    kind: raster
    select:
      require:
        assets.$asset.data_state:spectral_sampling: multispectral
    for_each: true
    path: assets.$asset.data_state:grid_aligned
    value: true
metadata_in:
  stac-resolver:
    search_glob: data/source.tif
process:
  align_grid:
    outputs:
      result:
        save: false
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
          settings:
            directory: output/data
        metadata_out:
          plugin: stac-json
          settings:
            directory: output/stac
    crs: EPSG:8857
    resampling: bilinear
  statistics:
    outputs:
      result:
        save: false
        encode:
          plugin: geotiff
        data_out:
          plugin: filesystem
          settings:
            directory: output/data
        metadata_out:
          plugin: stac-json
          settings:
            directory: output/stac
  global_radiometric_match: {}
sequence:
  group-by: {}
  split: {}
  combine: {}
services:
  executor:
    backend: threads
    workers: 1
  events: {}
encode:
  geotiff: {}
metadata_out:
  stac-json: {}
  stac-item: {}
data_out:
  filesystem: {}
data_transfer:
  buffered-transfer: {}
checkpoint:
  file-checkpoint: {}
checks:
  valid-data: {}
execution:
  sources:
  - stac-resolver
  query: {}
  modules:
  - align_grid
  - statistics
  - global_radiometric_match
  work_directory: work/reference
  discovery: false
  steps:
    prepare:
      auto: true
    project:
      plugin: align_grid
      settings:
        resampling: nearest
      param:resolution: 10
      transfer: optimized
    reuse_grid:
      plugin: align_grid
      param:crs: result:project:result#/assets/data/proj:code
      inputs:
        image: result:project:result
      checkpoint: null
    measure:
      plugin: statistics
      outputs:
        result:
          transfer: file
          save: false
          encode:
            plugin: geotiff
          data_out:
            plugin: filesystem
            settings:
              path: output/reference.tif
          metadata_out:
          - plugin: stac-json
            settings:
              path: output/reference.stac.json
              href_field: properties.example:metadata
          - plugin: stac-item
            settings:
              set:
                properties.example:reviewed: true
    finish:
      auto: true
  sequence:
    global_radiometric_match.images:
    - plugin: group-by
      settings:
        field: properties.platform
      scope: inventory
    - plugin: split
      settings:
        size: 8
    - plugin: combine
  data_transfer:
    plugin: buffered-transfer
    settings:
      memory_bytes: 268435456
  checkpoint:
    plugin: file-checkpoint
    settings:
      directory: work/checkpoints
      relative_to: config
      item_path: properties.data_state:directory_root
      checks:
      - plugin: valid-data
